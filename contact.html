<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="js/app.js" type="module"></script>
    

</head>
<body>
    <div class="page-shell">
    <h1><a href="index.html">The Treycave</a></h1>
  
    <nav>
        <div class="projects"><a href="projects.html">Resume</a></div>  
        <div class="contact"><a href="contact.html">Contact</a></div>
        <div class="demo"><a href="demos.html">Demo</a></div>
    </nav>

    <main class="container">
        <section class="my-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h3>Contact Form</h3>
                    <form id="contactForm">
                        <div class="contact-group reason-group">
                            <label>Select your reason for contact:</label>
                            <div class="reason-options">
                                <label><input type="radio" name="reason" value="Work"> Work</label>
                                <label><input type="radio" name="reason" value="Leisure"> Leisure</label>
                                <label><input type="radio" name="reason" value="Misc"> Misc</label>
                            </div>
                        </div>

                        <div class="contact-group">
                            <label for="emailInput">Enter your email:</label>
                            <input type="email" id="emailInput" required>
                        </div>

                        <div class="contact-group">
                            <label for="messageInput">Enter your message:</label>
                            <textarea id="messageInput" required></textarea>
                        </div>

                        <div class="contact-actions">
                            <button type="button" id="submitBtn">Send</button>
                            <button type="button" id="clearBtn">Clear</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    

    <div id="floating-player">
        <iframe id="youtube-iframe" 
                width="100%" 
                height="100%" 
                src="https://www.youtube.com/embed?listType=playlist&list=PL3tRBEVW0hiA8SaR1o_IqK6AGp5FJt8d2&loop=1&modestbranding=1&rel=0" 
                frameborder="0" 
                allow="encrypted-media" 
                allowfullscreen>
        </iframe>
        <button id="close-player" aria-label="Close Player">×</button>
    </div>
    </div>
</body>
</html>
